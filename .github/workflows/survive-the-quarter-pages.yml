name: Deploy Survive the Quarter Game UI

on:
  push:
    branches: ["main"]
    paths:
      - "survive-the-quarter-game/**"
      - ".github/workflows/survive-the-quarter-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: survive-the-quarter-game

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
